name: Fix Full Script Library Mode CRLF

on:
  push:
    branches:
      - redux-implementation
    paths:
      - .github/workflows/fix-full-library-mode-crlf.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Redux implementation
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore full script from development and patch guards without newline conversion
        shell: bash
        run: |
          git fetch origin development
          git show origin/development:AstroTemps_AutoProcessing_Tool.js > AstroTemps_AutoProcessing_Tool.js
          python3 - <<'PY'
          from pathlib import Path

          path = Path("AstroTemps_AutoProcessing_Tool.js")
          data = path.read_bytes()
          eol = b"\r\n" if b"\r\n" in data else b"\n"

          feature = b"#feature-id Utilities > AstroTemps AutoProcessing Tool" + eol
          feature_pos = data.find(feature)
          if feature_pos < 0:
              raise SystemExit("Full-script feature-id anchor not found")

          if b"#ifndef ASTROTEMPS_LIBRARY_MODE" not in data[:feature_pos + len(feature)]:
              data = data[:feature_pos] + b"#ifndef ASTROTEMPS_LIBRARY_MODE" + eol + data[feature_pos:]
              feature_pos += len(b"#ifndef ASTROTEMPS_LIBRARY_MODE" + eol)

          info_pos = data.find(b"#feature-info ", feature_pos)
          if info_pos < 0:
              raise SystemExit("Full-script feature-info anchor not found")
          info_end = data.find(eol, info_pos)
          if info_end < 0:
              raise SystemExit("Full-script feature-info line ending not found")
          info_end += len(eol)
          if data[info_end:info_end + len(b"#endif") ] != b"#endif":
              data = data[:info_end] + b"#endif" + eol + data[info_end:]

          main_pos = data.rfind(b"main();")
          if main_pos < 0:
              raise SystemExit("Full-script final main() anchor not found")
          before = data[max(0, main_pos - 80):main_pos]
          if b"#ifndef ASTROTEMPS_LIBRARY_MODE" not in before:
              main_end = main_pos + len(b"main();")
              replacement = (
                  b"#ifndef ASTROTEMPS_LIBRARY_MODE" + eol +
                  b"main();" + eol +
                  b"#endif"
              )
              data = data[:main_pos] + replacement + data[main_end:]

          if eol == b"\r\n":
              lone_lf = data.count(b"\n") - data.count(b"\r\n")
              if lone_lf != 0:
                  raise SystemExit(f"Unexpected lone LF line endings after patch: {lone_lf}")

          path.write_bytes(data)
          print("Restored development source and applied library guards with original line endings.")
          PY

      - name: Run all automated regressions
        run: |
          python3 tools/test_spcc_gaia_guard.py
          python3 tools/test_redux_static.py
          python3 tools/test_redux_package.py

      - name: Commit corrected full script
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AstroTemps_AutoProcessing_Tool.js
          git commit -m "fix: preserve full-script CRLF in Redux library mode"
          git push
