name: Prepare AstroTemps v1.3.0

on:
  push:
    branches:
      - development
    paths:
      - .github/workflows/prepare-v1.3.0.yml

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development
        uses: actions/checkout@v4
        with:
          ref: development

      - name: Bump release version
        shell: python
        run: |
          from pathlib import Path

          version = "1.3.0"
          files = [
              Path("AstroTemps_AutoProcessing_Tool.js"),
              Path("AstroTemps_Redux.js"),
          ]

          for path in files:
              data = path.read_bytes()
              count = data.count(b"1.2.0")
              if count != 3:
                  raise SystemExit(f"{path}: expected exactly 3 occurrences of 1.2.0, found {count}")
              path.write_bytes(data.replace(b"1.2.0", version.encode("ascii")))

          Path("VERSION").write_text(version + "\n", encoding="utf-8", newline="\n")

      - name: Commit version bump and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/prepare-v1.3.0.yml
          git add AstroTemps_AutoProcessing_Tool.js AstroTemps_Redux.js VERSION
          git commit -m "release: prepare AstroTemps v1.3.0"
          git push origin development
