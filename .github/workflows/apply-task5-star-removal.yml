name: Apply Redux Star Removal

on:
  push:
    branches:
      - redux-implementation
    paths:
      - tools/apply_task5_star_removal.py
      - .github/workflows/apply-task5-star-removal.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply Task 5 patch
        run: python3 tools/apply_task5_star_removal.py
      - name: Run Redux static test
        run: python3 tools/test_redux_static.py
      - name: Run SPCC Gaia regression test
        run: python3 tools/test_spcc_gaia_guard.py
      - name: Commit patched Redux source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AstroTemps_Redux.js
          if git diff --cached --quiet; then
            echo "No Redux source changes to commit."
          else
            git commit -m "feat: add Redux star-removal fallback"
            git push
          fi
