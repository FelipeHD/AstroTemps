name: Build PixInsight Update Repository

on:
  workflow_dispatch:
  push:
    branches:
      - pixinsight-update-repository
    paths:
      - AstroTemps_AutoProcessing_Tool.js
      - AstroTemps_Redux.js
      - VERSION
      - tools/build_update.py
      - .github/workflows/build-pixinsight-update.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check stable release source
        id: source
        shell: bash
        run: |
          if [ -f AstroTemps_AutoProcessing_Tool.js ] && [ -f AstroTemps_Redux.js ] && [ -f VERSION ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Stable release sources or VERSION file are missing. Nothing will be published."
          fi

      - name: Build PixInsight package and XRI
        if: steps.source.outputs.present == 'true'
        run: python3 tools/build_update.py

      - name: Commit generated update repository files
        if: steps.source.outputs.present == 'true'
        shell: bash
        run: |
          VERSION="$(tr -d '\r\n' < VERSION)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A updates/
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Build PixInsight update repository for v${VERSION}"
            git push
          fi
