name: Cleanup Redux Temporary Files

on:
  push:
    branches:
      - redux-implementation
    paths:
      - .github/workflows/cleanup-redux-temporary.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove implementation-only helpers
        shell: bash
        run: |
          rm -f \
            .github/workflows/apply-task5-star-removal.yml \
            .github/workflows/apply-task6-starless-processing.yml \
            .github/workflows/apply-task7-final-workflow.yml \
            .github/workflows/extract-redux-task6-helpers.yml \
            .github/workflows/fix-full-library-mode-crlf.yml \
            .github/workflows/probe-redux-helpers.yml \
            .github/workflows/write-redux-helper-map.yml \
            tools/apply_task5_star_removal.py \
            tools/apply_task6_starless_processing.py \
            tools/apply_task7_final_workflow.py \
            tools/extract_redux_task6_helpers.py \
            tools/probe_redux_helpers.py \
            tools/redux_function_index.txt \
            tools/redux_helper_map.txt \
            tools/redux_source_slices.txt \
            tools/redux_task6_helpers.txt \
            tools/write_redux_function_index.py \
            tools/write_redux_helper_map.py \
            tools/write_redux_source_slices.py \
            .github/workflows/cleanup-redux-temporary.yml

      - name: Run final automated regressions before cleanup commit
        run: |
          python3 tools/test_spcc_gaia_guard.py
          python3 tools/test_redux_static.py
          python3 tools/test_redux_package.py

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove Redux implementation helpers"
          git push
