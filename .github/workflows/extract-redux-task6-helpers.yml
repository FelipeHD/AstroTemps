name: Extract Redux Task6 Helpers

on:
  push:
    branches:
      - redux-implementation
    paths:
      - tools/extract_redux_task6_helpers.py
      - .github/workflows/extract-redux-task6-helpers.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Extract helper functions
        run: python3 tools/extract_redux_task6_helpers.py
      - name: Commit helper extract
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/redux_task6_helpers.txt
          if git diff --cached --quiet; then
            echo "No helper extract changes."
          else
            git commit -m "chore: record temporary Redux task6 helpers"
            git push
          fi
