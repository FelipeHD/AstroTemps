name: Apply SPCC Gaia Guard

on:
  push:
    branches:
      - development
    paths:
      - tools/apply_spcc_gaia_guard.py
      - .github/workflows/apply-spcc-gaia-guard.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply patch
        run: python3 tools/apply_spcc_gaia_guard.py
      - name: Run regression test
        run: python3 tools/test_spcc_gaia_guard.py
      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AstroTemps_AutoProcessing_Tool.js
          if git diff --cached --quiet; then
            echo "No source changes to commit."
          else
            git commit -m "Handle SPCC Gaia DR3/SP catalog failures"
            git push
          fi
