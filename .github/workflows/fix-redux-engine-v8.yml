name: Fix Redux V8 Engine Ownership

on:
  push:
    branches:
      - development

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: development

      - name: Patch scripts without normalizing line endings
        shell: python
        run: |
          from pathlib import Path

          full_path = Path("AstroTemps_AutoProcessing_Tool.js")
          data = full_path.read_bytes()
          old = b"#engine v8\r\n\r\n#ifndef ASTROTEMPS_LIBRARY_MODE"
          new = b"#ifndef ASTROTEMPS_LIBRARY_MODE\r\n#engine v8\r\n#endif\r\n\r\n#ifndef ASTROTEMPS_LIBRARY_MODE"
          if old in data:
              data = data.replace(old, new, 1)
              full_path.write_bytes(data)
          elif new not in data:
              raise SystemExit("Could not find expected full-script engine marker")

          redux_path = Path("AstroTemps_Redux.js")
          text = redux_path.read_text(encoding="utf-8")
          include = '#include "AstroTemps_AutoProcessing_Tool.js"'
          if "#engine v8" not in text:
              marker = "#define ASTROTEMPS_LIBRARY_MODE\n"
              if marker not in text:
                  raise SystemExit("Could not find Redux library-mode marker")
              text = text.replace(marker, "#engine v8\n\n" + marker, 1)
              redux_path.write_text(text, encoding="utf-8", newline="\n")
          if text.find("#engine v8") > text.find(include):
              raise SystemExit("Redux #engine v8 is not before include")

      - name: Commit fix if needed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AstroTemps_AutoProcessing_Tool.js AstroTemps_Redux.js
          if git diff --cached --quiet; then
            echo "No engine ownership changes needed."
          else
            git commit -m "fix: make Redux own the V8 script engine"
            git push origin development
          fi
