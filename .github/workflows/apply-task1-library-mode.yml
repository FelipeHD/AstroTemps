name: Apply Redux Library Mode

on:
  push:
    branches:
      - redux-implementation
    paths:
      - tools/apply_task1_library_mode.py
      - .github/workflows/apply-task1-library-mode.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply library-mode patch
        run: python3 tools/apply_task1_library_mode.py
      - name: Run Redux static test
        run: python3 tools/test_redux_static.py
      - name: Run SPCC Gaia regression test
        run: python3 tools/test_spcc_gaia_guard.py
      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AstroTemps_AutoProcessing_Tool.js
          if git diff --cached --quiet; then
            echo "No source changes to commit."
          else
            git commit -m "refactor: expose AstroTemps library mode for Redux"
            git push
          fi
