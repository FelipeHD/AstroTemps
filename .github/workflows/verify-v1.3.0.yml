name: Verify AstroTemps v1.3.0

on:
  push:
    branches:
      - development
    paths:
      - .github/workflows/verify-v1.3.0.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development
        uses: actions/checkout@v4
        with:
          ref: development

      - name: Verify release version
        run: |
          test "$(tr -d '\r\n' < VERSION)" = "1.3.0"
          grep -q 'var VERSION = "1.3.0";' AstroTemps_AutoProcessing_Tool.js
          grep -q 'var REDUX_VERSION = "1.3.0";' AstroTemps_Redux.js

      - name: Run SPCC Gaia regression test
        run: python3 tools/test_spcc_gaia_guard.py

      - name: Run Redux static regression test
        run: python3 tools/test_redux_static.py

      - name: Run Redux V8 Dialog regression test
        run: python3 tools/test_redux_dialog_v8.py

      - name: Run Redux package regression test
        run: python3 tools/test_redux_package.py

      - name: Remove temporary verification workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/verify-v1.3.0.yml
          git commit -m "chore: remove v1.3.0 verification workflow"
          git push origin development
