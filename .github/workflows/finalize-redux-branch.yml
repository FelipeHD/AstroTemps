name: Finalize Redux Implementation Branch

on:
  push:
    branches:
      - redux-implementation
    paths:
      - .github/workflows/finalize-redux-branch.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with development history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run final automated regressions
        run: |
          python3 tools/test_spcc_gaia_guard.py
          python3 tools/test_redux_static.py
          python3 tools/test_redux_package.py

      - name: Restore tracked update artifacts and remove implementation-only CI
        shell: bash
        run: |
          git fetch origin development
          git checkout origin/development -- updates/AstroTemps-v1.2.0.zip updates/updates.xri
          rm -f .github/workflows/test-redux-implementation.yml
          rm -f .github/workflows/finalize-redux-branch.yml

      - name: Commit finalized branch tree
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: finalize Redux implementation branch"
          git push
